; platformio.ini
;
; Configuração do projeto PlatformIO.
; Se você já criou um projeto pelo PIO Home, pode ter um platformio.ini
; parecido com esse — só adicione a linha "lib_deps" se ainda não tiver.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bibliotecas externas que o firmware precisa.
; O PlatformIO baixa isso sozinho na primeira compilação (precisa de internet).
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; Ambiente extra, só pra monitorar a simulação do Wokwi (não usa isso pra
; gravar no ESP32 de verdade - pra isso, continue usando o ambiente "esp32dev" acima).
; Aparece como um item separado no painel do PlatformIO: "wokwi".
[env:wokwi]
extends = env:esp32dev
monitor_port = rfc2217://localhost:4000
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
